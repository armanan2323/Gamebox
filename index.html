<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta name="theme-color" content="#f7f8f6">
    <meta name="description" content="GameBox - коллекция браузерных игр">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">

    <link rel="manifest" href="manifest.json">

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/games.css">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="apple-touch-icon" href="favicon.png">

    <title>GameBox</title>
</head>

<body>

<header class="site-header">
    <div class="header-inner">
        <button class="brand" id="homeButton">
            GameBox
        </button>

        <span class="offline-badge">
            17 игр · офлайн
        </span>
    </div>
</header>

<main class="container">

    <section id="homeView">

        <div class="intro">
            <p class="eyebrow">
                Игровая коллекция
            </p>

            <h1>
                Игры без лишнего.
            </h1>

            <p class="intro-text">
                Небольшая коллекция браузерных игр.
                Работает на компьютере и телефоне.
                После первого открытия может работать без интернета.
            </p>
        </div>

        <section class="category">
            <h2>Аркады</h2>
            <div class="games-grid" id="arcadeGrid"></div>
        </section>

        <section class="category">
            <h2>Головоломки</h2>
            <div class="games-grid" id="puzzleGrid"></div>
        </section>

        <section class="category">
            <h2>Два игрока</h2>
            <div class="games-grid" id="twoPlayerGrid"></div>
        </section>

        <section class="category">
            <h2>На реакцию</h2>
            <div class="games-grid" id="reactionGrid"></div>
        </section>

    </section>

    <section id="gameView" class="hidden">

        <div class="game-page-head">

            <button
                class="back-button"
                id="backButton"
            >
                ← Все игры
            </button>

            <p
                class="eyebrow"
                id="gameCategory"
            ></p>

            <h1 id="gameTitle"></h1>

        </div>

        <div id="gameRoot"></div>

    </section>

</main>

<footer class="site-footer">
    <span>GameBox</span>
    <span>HTML · CSS · JavaScript</span>
</footer>

<script src="js/games/snake.js"></script>
<script src="js/games/tetris.js"></script>
<script src="js/games/minesweeper.js"></script>
<script src="js/games/pong.js"></script>
<script src="js/games/memory.js"></script>
<script src="js/games/tic-tac-toe.js"></script>

<script src="js/games/2048.js"></script>
<script src="js/games/breakout.js"></script>
<script src="js/games/flappy-bird.js"></script>
<script src="js/games/connect-four.js"></script>
<script src="js/games/sudoku.js"></script>
<script src="js/games/space-invaders.js"></script>
<script src="js/games/chess.js"></script>
<script src="js/games/checkers.js"></script>
<script src="js/games/battleship.js"></script>
<script src="js/games/puzzle-15.js"></script>
<script src="js/games/reaction.js"></script>
<script src="js/games/doodle-jump.js"></script>

<script src="js/app.js"></script>

</body>
</html>
